name: you_app
description: A new Flutter project.
publish_to: 'none'
version: 1.1.0+10

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  audioplayers: ^6.5.0
  cloud_firestore: ^6.0.2
  collection: ^1.19.1
  firebase_ai: ^3.2.0
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.0
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_swipe_button: ^2.1.3
  flutter_zoom_drawer: ^3.2.0
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  # Imported directly by the volunteer_signup_info tabs. Declared
  # explicitly rather than relied on as a transitive dep of stacked —
  # if stacked ever drops it, those three files stop compiling.
  provider: ^6.1.5+1
  google_sign_in: ^6.3.0
  google_sign_in_dartio: ^0.3.0
  image_picker: ^1.2.0
  # Direct deps so we can opt into Android's system Photo Picker in main.dart
  # (ImagePickerAndroid.useAndroidPhotoPicker), which needs no media permission.
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  intl: ^0.20.2
  just_audio: ^0.10.4
  liquid_glass_renderer: ^0.1.1-dev.10
  permission_handler: ^12.0.1
  pin_code_fields: ^8.0.1
  purchases_flutter: ^10.4.0
  record: ^5.1.2
  shared_preferences: ^2.5.3
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  step_progress_indicator: ^1.0.2
  url_launcher: ^6.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_messaging: ^16.2.2
  timeago: ^3.7.1
  lottie: ^3.3.3
  firebase_storage: ^13.4.2
  http: ^1.2.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  audio_session: ^0.2.3
  showcaseview: ^5.0.2
  responsive_framework: ^1.5.1
  flutter_dotenv: ^5.1.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  cloud_functions: ^6.0.2
  purchases_ui_flutter: ^10.4.0

# `record 5.2.1` caps record_linux <1.0.0 (0.7.2), which is built against an
# older record_platform_interface and fails to compile against the 1.6.0 that
# record_android pulls in. We don't ship Linux, so force a record_linux that
# implements the current interface to keep the build green.
  stacked_shared: any
dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/sounds/
    - assets/json/
    - assets/animations/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_round.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  # The background color of your splash screen (e.g., white or your app's primary color)
  color: "#A7BABE" 
  # The path to your logo
  image: "assets/images/logo_splash.png"
  
  android_12:
    # Android 12+ requires a specific API for splash screens
    image: "assets/images/logo_splash.png"
    icon_background_color: "#A7BABE"